<!doctype html>
<html lang="en" style="background-color: #000000; color: #f5f5f7; height: 100%;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sangeet</title>
    <meta name="description" content="Sangeet - Petrol Pump Forecourt Radio and Smart Promo Broadcaster" />
    <meta property="og:title" content="Sangeet" />
    <meta property="og:description" content="Sangeet - Petrol Pump Forecourt Radio and Smart Promo Broadcaster" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sangeet" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Filter benign Vite development WebSocket disconnection events and browser extension probes in preview iframe
      window.addEventListener('unhandledrejection', function(event) {
        var msg = (event?.reason?.message || '').toLowerCase();
        var stack = (event?.reason?.stack || '').toLowerCase();
        if (
          msg.includes('websocket') ||
          msg.includes('vite') ||
          msg.includes('failed to fetch') ||
          stack.includes('chrome-extension://') ||
          stack.includes('page-media-probe')
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event?.message || '').toLowerCase();
        var filename = (event?.filename || '').toLowerCase();
        if (
          filename.includes('chrome-extension://') ||
          filename.includes('page-media-probe') ||
          msg.includes('websocket') ||
          msg.includes('vite')
        ) {
          event.preventDefault();
        }
      });
      // Purge any stale service workers in preview environment
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.unregister();
          }
        });
      }
    </script>
  </head>
  <body class="bg-black text-[#f5f5f7] antialiased selection:bg-[#ff9500] selection:text-black font-sans" style="background-color: #000000; color: #f5f5f7; min-height: 100vh; margin: 0;">
    <div id="root" style="min-height: 100vh; background-color: #000000;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
